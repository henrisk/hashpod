name: hashpod
description: "Lightweight desktop client for container management (Docker/Podman) via SSH."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # --- UI & Theming ---
  cupertino_icons: ^1.0.8
  flex_color_scheme: ^8.2.0       # Advanced theming with dark mode
  google_fonts: ^6.2.1            # Inter / JetBrains Mono typography
  fl_chart: ^0.70.0               # Sparklines / charts for CPU & RAM
  gap: ^3.0.1                     # Spacing utility

  # --- Navigation ---
  go_router: ^15.1.2

  # --- State Management ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- Localization delegate ---
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # --- Data / Models ---
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # --- Internationalization (slang) ---
  slang: ^4.12.1
  slang_flutter: ^4.12.1

  # --- SSH & Networking ---
  dartssh2: ^2.9.0               # SSH tunnels and remote execution
  http: ^1.3.0                   # HTTP client for Docker/Podman API

  # --- Storage & Config ---
  shared_preferences: ^2.3.5    # Lightweight local persistence
  path_provider: ^2.1.5         # File paths (SSH key picker)
  path: ^1.9.1

  # --- System / Desktop ---
  window_manager: ^0.4.3        # Window title, size, custom decorations
  # tray_manager: ^0.2.3        # System tray icon — requires libayatana-appindicator3 on Linux (re-add when needed)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # --- Code generation ---
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  freezed: ^3.0.0
  json_serializable: ^6.9.4

  # --- Slang build runner ---
  slang_build_runner: ^4.12.1

flutter:
  uses-material-design: true

  # assets/fonts/ not needed — google_fonts loads Inter and JetBrains Mono at runtime
  # Uncomment when you add actual image/icon assets:
  # assets:
  #   - assets/images/

  assets:
    - assets/translations/
